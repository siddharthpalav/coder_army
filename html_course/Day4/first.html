<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>University Registration form</h1>
    <p>Please fill out the form</p>
    <hr />

    <form action="">
      <h2>Personal Details</h2>

      <label for="name">First Name: </label>
      <input type="text" name="name" id="name" placeholder="e.g., Arjun" />
      <br />
      <br />

      <label for="surname">Last Name: </label>
      <input type="text" name="surname" id="surname" placeholder="e.g.,Kumar" />
      <br />
      <br />

      <label for="dob">Date of Birth: </label>
      <input type="date" name="dob" id="dob" />

      <br />
      <br />

      <h3>Gender</h3>
      <label for="">Male</label>
      <input type="radio" name="gender" value="male" id="" />
      <br />
      <br />
      <label for="">Female</label>
      <input type="radio" name="gender" value="male" id="" />
      <br />
      <br />
      <label for="">Other</label>
      <input type="radio" name="gender" value="male" id="" />
      <br />
      <br />

      <h3>Upload Your photo</h3>

      <input type="file" name="" id="" />

      <hr />

      <h2>Contact Information</h2>

      <label for="email">Email Address</label>
      <input type="email" name="email" id="email" />

      <br />
      <br />

      <label for="phone">Phone</label>
      <input type="tel" name="phone" id="phone" />

      <br />
      <br />

      <label for="">Mailing Address</label>
      <br />
      <textarea name="Address" id="Address" rows="10" cols="30"></textarea>

      <hr />

      <h2>Academic Information</h2>

      <label for="course">Select Your Course:</label>

      <br />

      <select name="course" id="course">
        <option value="CSE">CSE</option>
        <option value="ME">ME</option>
        <option value="EE">EE</option>
      </select>

      <br />
      <br />

      <h3>Extracurricular Interests</h3>

      <label for="">Sports</label>
      <input type="checkbox" name="interest" id="Sports" value="Sports" />
      <br />
      <br />
      <label for="">Music & Arts</label>
      <input type="checkbox" name="interest" id="Music" value="Music" />
      <br />
      <br />
      <label for="">Technology Clubs</label>
      <input
        type="checkbox"
        name="interest"
        id="Technology"
        value="Technology"
      />
      <br />
      <br />
      <label for="">Volunteering</label>
      <input
        type="checkbox"
        name="interest"
        id="Volunteering"
        value="Volunteering"
      />
      <br />
      <br />

      <hr />

      <h2>Create Your account</h2>

      <label for="">Create Password: </label>
      <input type="password" />

      <br />
      <br />

      <label for="">Security Question:</label>

      <select name="" id="">
        <option value="">What was your first pet's name</option>
      </select>

      <br />
      <br />

      <label for="">Security Answer: </label>
      <input type="text" name="" id="" />

      <br />
      <br />

      <input type="checkbox" name="" id="" />
      <label for="">I agree to the Terms and Conditions.</label>

      <hr />

      <button type="submit">Register</button>
      <button type="reset">Clear Form</button>
    </form>
  </body>
</html>
